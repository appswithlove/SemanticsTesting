name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.app
      - name: Pick simulator
        id: sim
        run: |
          NAME=$(xcrun simctl list devices available | grep -o 'iPhone [0-9][0-9a-zA-Z ]*' | head -1 | sed 's/ *$//')
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
      - run: brew install xcbeautify
      - name: Test
        run: |
          xcodebuild test \
            -scheme SemanticsTesting \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}" \
            -resultBundlePath TestResults.xcresult \
            | xcbeautify --renderer github-actions
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: TestResults
          path: TestResults.xcresult
  lint:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: brew install swiftformat swiftlint
      - run: swiftformat --lint .
      - run: swiftlint --strict
